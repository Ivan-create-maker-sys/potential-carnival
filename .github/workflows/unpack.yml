
name: Unpack Bedrock UI project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          if [ ! -f "Bedrock-UI-project.zip" ]; then
            echo "ZIP archive not found"
            exit 1
          fi

          mkdir -p /tmp/bedrock-ui
          unzip -q -o "Bedrock-UI-project.zip" -d /tmp/bedrock-ui

          if [ ! -d "/tmp/bedrock-ui/Bedrock-UI" ]; then
            echo "Project folder not found inside ZIP"
            exit 1
          fi

          cp -a /tmp/bedrock-ui/Bedrock-UI/. .
          rm "Bedrock-UI-project.zip"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- .github/workflows

          if ! git diff --cached --quiet; then
            git commit -m "Extract Bedrock UI project"
            git push
          fi
          
