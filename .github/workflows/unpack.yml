name: Unpack Bedrock UI project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          if [ ! -f "Bedrock-UI-project.zip" ]; then
            echo "ERROR: Bedrock-UI-project.zip was not found in the repository root."
            exit 1
          fi

          mkdir -p /tmp/bedrock-ui
          unzip -q -o "Bedrock-UI-project.zip" -d /tmp/bedrock-ui

          if [ ! -d "/tmp/bedrock-ui/Bedrock-UI" ]; then
            echo "ERROR: The ZIP does not contain the expected Bedrock-UI folder."
            exit 1
          fi

          cp -a /tmp/bedrock-ui/Bedrock-UI/. .
          rm "Bedrock-UI-project.zip"

      - name: Save extracted project files to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Add Bedrock UI project files"
            git push
          fi
          
